<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Rotation</title><style id="app-style">
:root{
  --bg:#eef2e9;
  --surface:#ffffff;
  --ink:#1c2418;
  --ink-soft:#586152;
  --line:#d7ddce;
  --herb:#3f6b4a;
  --herb-soft:#e3ede3;
  --gold:#b9821f;
  --gold-soft:#f6ecd6;
  --warn:#b0502f;
  --warn-soft:#f5e2d9;
  --love:#b8375f;
  --love-soft:#f6dfe6;
  --idea:#3c6e8f;
  --idea-soft:#dfe9ee;
  --queue:#7c5ba6;
  --queue-soft:#ece3f3;
  --adjust:#0f766e;
  --adjust-soft:#d9f0ee;
  --chip-bg:#eef1e6;
  --shadow: 0 1px 2px rgba(28,36,24,0.06), 0 6px 16px rgba(28,36,24,0.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161a13;
    --surface:#1f2519;
    --ink:#e9edE0;
    --ink-soft:#a9b39c;
    --line:#333c2b;
    --herb:#83bd8e;
    --herb-soft:#26331f;
    --gold:#e3b455;
    --gold-soft:#332a16;
    --warn:#e0855f;
    --warn-soft:#3a2419;
    --love:#e88aa8;
    --love-soft:#3a2029;
    --idea:#8ec3dd;
    --idea-soft:#1c2b33;
    --queue:#c9a8e6;
    --queue-soft:#2b2038;
    --adjust:#5eead4;
    --adjust-soft:#123330;
    --chip-bg:#242b1d;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#161a13;
  --surface:#1f2519;
  --ink:#e9edE0;
  --ink-soft:#a9b39c;
  --line:#333c2b;
  --herb:#83bd8e;
  --herb-soft:#26331f;
  --gold:#e3b455;
  --gold-soft:#332a16;
  --warn:#e0855f;
  --warn-soft:#3a2419;
  --love:#e88aa8;
  --love-soft:#3a2029;
  --idea:#8ec3dd;
  --idea-soft:#1c2b33;
  --queue:#c9a8e6;
  --queue-soft:#2b2038;
  --adjust:#5eead4;
  --adjust-soft:#123330;
  --chip-bg:#242b1d;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{background:var(--bg);}
body{
  margin:0;
  padding-inline:16px;
  padding-block:20px 48px;
  font-family:"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;}
h1{
  font-family:"Libre Franklin", "Source Sans 3", sans-serif;
  font-weight:800;
  font-size:clamp(28px,7vw,36px);
  letter-spacing:-0.01em;
  margin:0 0 4px;
  text-wrap:balance;
}
.tag{
  font-family:"JetBrains Mono","SFMono-Regular",monospace;
  font-size:12px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--herb);
  font-weight:600;
}
.sub{color:var(--ink-soft); font-size:14.5px; margin:6px 0 22px; max-width:52ch;}
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.field-label{
  font-family:"JetBrains Mono",monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--ink-soft);
  margin:0 0 8px;
}
.chip-toggle{
  appearance:none; -webkit-appearance:none;
  border:1.5px solid var(--line);
  background:var(--chip-bg);
  color:var(--ink);
  border-radius:999px;
  padding:8px 14px;
  font-size:14.5px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  transition:background .15s, border-color .15s, color .15s;
}
.chip-toggle[aria-pressed="true"]{
  background:var(--herb);
  border-color:var(--herb);
  color:#fff;
}
.seg{display:flex; background:var(--chip-bg); border-radius:12px; padding:4px; gap:4px;}
.seg button{
  flex:1; appearance:none; border:none; background:transparent;
  padding:9px 10px; border-radius:9px; font-family:inherit; font-weight:700;
  font-size:14.5px; color:var(--ink-soft); cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
.divider{height:1px;background:var(--line); margin:14px 0;}
.cta{
  width:100%;
  border:none;
  background:var(--herb);
  color:#fff;
  font-family:"Libre Franklin",sans-serif;
  font-weight:800;
  font-size:16px;
  padding:14px 18px;
  border-radius:12px;
  cursor:pointer;
  letter-spacing:0.01em;
}
.cta:active{transform:translateY(1px);}
.stat-line{color:var(--ink-soft); font-size:13px; margin-top:10px; text-align:center; font-family:"JetBrains Mono",monospace;}
#cards{display:flex; flex-direction:column; gap:12px; margin-top:18px;}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px 16px 14px;
  box-shadow:var(--shadow);
  border-left:5px solid var(--herb);
  position:relative;
}
.card.warn{border-left-color:var(--warn);}
.card .dish{
  font-family:"Libre Franklin",sans-serif;
  font-weight:700;
  font-size:17px;
  line-height:1.32;
  margin:0 0 8px;
  text-wrap:balance;
}
.badges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
.badge{
  font-size:11.5px; font-weight:700; letter-spacing:0.02em;
  padding:3px 9px; border-radius:999px;
  background:var(--chip-bg); color:var(--ink-soft);
}
.badge.ok{background:var(--herb-soft); color:var(--herb);}
.badge.gold{background:var(--gold-soft); color:var(--gold);}
.badge.warn{background:var(--warn-soft); color:var(--warn);}
.badge.love{background:var(--love-soft); color:var(--love);}
.badge.idea{background:var(--idea-soft); color:var(--idea);}
.badge.queue{background:var(--queue-soft); color:var(--queue);}
.badge.adjust{background:var(--adjust-soft); color:var(--adjust);}
.meta{color:var(--ink-soft); font-size:13px; margin-bottom:12px;}
.meta b{color:var(--ink); font-weight:700;}
.card-actions{display:flex; gap:8px; flex-wrap:wrap;}
.btn-small{
  flex:1 1 auto; min-width:118px; border-radius:10px; padding:9px 10px; font-family:inherit;
  font-weight:700; font-size:13.5px; cursor:pointer; border:1.5px solid var(--line);
  background:var(--chip-bg); color:var(--ink);
}
.btn-small.primary{background:var(--herb); border-color:var(--herb); color:#fff;}
.adjust-form{margin-top:10px;}
.adjust-form textarea{
  width:100%; min-height:60px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
  font-family:inherit; font-size:14px; background:var(--bg); color:var(--ink); resize:vertical;
}
.more-btn{
  width:100%;
  border:1.5px dashed var(--line);
  background:transparent;
  color:var(--herb);
  font-family:"Libre Franklin",sans-serif;
  font-weight:700;
  font-size:14.5px;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  margin-top:4px;
}
.empty{color:var(--ink-soft); text-align:center; padding:26px 10px; font-size:14.5px;}
details.add-card{
  margin-top:18px; border:1.5px dashed var(--line); border-radius:16px; padding:14px 16px; background:transparent;
}
details.add-card summary{cursor:pointer; font-weight:700; color:var(--herb); list-style:none; font-family:"Libre Franklin",sans-serif;}
details.add-card summary::-webkit-details-marker{display:none;}
.add-form{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
.add-form input[type="text"]{
  width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line);
  font-family:inherit; font-size:14.5px; background:var(--bg); color:var(--ink);
}
.add-form label.check{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-soft);}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px;
  font-size:13.5px; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

let state = { clive:true, patricia:true, guest:false, makeAhead:false, loved:false, isIdea:false, willTry:false, showDisliked:false, meal:'Lunch', shown:[] };
let adjustFormOpenFor = null;
let artifactApi = null;

function daysSince(iso){
  if(!iso) return Infinity;
  const then = new Date(iso+'T00:00:00');
  const now = new Date();
  return Math.round((now-then)/86400000);
}
function fmtDate(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');
  return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function eligiblePool(){
  const mealKey = state.meal.toLowerCase();
  return DISHES.filter(d=>{
    if(d.meal.toLowerCase()!==mealKey) return false;
    if(state.clive && !d.cliveSafe) return false;
    if(state.guest && !d.vegan) return false;
    if(state.makeAhead && !d.makeAhead) return false;
    if(state.loved && !d.loved) return false;
    if(state.isIdea && !d.isIdea) return false;
    if(state.willTry && !d.willTry) return false;
    if(state.showDisliked){ if(!d.disliked) return false; } else { if(d.disliked) return false; }
    return true;
  });
}
function pickSuggestions(n){
  const pool = eligiblePool().slice().sort((a,b)=>daysSince(b.date)-daysSince(a.date));
  const topSlice = pool.slice(0, Math.max(n*3, 12));
  for(let i=topSlice.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [topSlice[i],topSlice[j]]=[topSlice[j],topSlice[i]];
  }
  return topSlice.slice(0,n);
}
function keyOf(d){ return d.text+'||'+d.meal; }

function badgeList(d){
  const badges = [];
  if(d.protein){
    d.protein.split(/[\/,]/).map(s=>s.trim()).filter(Boolean).slice(0,3).forEach(p=>{
      badges.push('<span class="badge">'+p+'</span>');
    });
  }
  if(d.loved) badges.push('<span class="badge love">&#10084; Loved</span>');
  if(d.isIdea) badges.push('<span class="badge idea">&#10024; New idea</span>');
  if(d.willTry) badges.push('<span class="badge queue">&#128204; Will try</span>');
  if(d.cliveSafe) badges.push('<span class="badge ok">Clive-safe</span>');
  if(d.vegan) badges.push('<span class="badge gold">Vegan</span>');
  if(d.lowSodium) badges.push('<span class="badge ok">Low-sodium</span>');
  if(d.makeAhead) badges.push('<span class="badge gold">Make-ahead</span>');
  if(!d.cliveSafe) badges.push('<span class="badge warn">Not for Clive</span>');
  if(d.disliked) badges.push('<span class="badge warn">&#128683; Won\'t like</span>');
  if(d.needsAdjustment) badges.push('<span class="badge adjust">&#128295; Needs a tweak</span>');
  return badges.join('');
}

function cardHTML(d){
  const ds = daysSince(d.date);
  const lastMade = d.date ? ('Last made <b>'+ds+' day'+(ds===1?'':'s')+' ago</b> ('+fmtDate(d.date)+')') : 'Never logged before — a first!';
  let context = (d.madeFor && d.madeFor!=='Both') ? ' &middot; originally made for '+d.madeFor.toLowerCase() : '';
  if(d.makeAhead) context += ' &middot; good to prep ahead & reheat';
  if(d.loved && d.lovedNote) context += ' &middot; '+d.lovedNote;
  if(d.isIdea && d.inspiredBy) context += ' &middot; '+d.inspiredBy;
  if(d.disliked && d.dislikedNote) context += ' &middot; '+d.dislikedNote;
  if(d.needsAdjustment && d.adjustmentNote) context += ' &middot; Adjust: '+d.adjustmentNote;
  const k = keyOf(d).replace(/"/g,'&quot;');
  const neverMade = !d.date;
  const madeLabel = neverMade ? '✓ Made it!' : '✓ Cooked this today';
  const willTryBtn = neverMade
    ? '<button class="btn-small" onclick="toggleWillTry(\''+k+'\')">'+(d.willTry ? '📌 Remove from queue' : '📌 Will try')+'</button>'
    : '';
  const adjustLabel = d.needsAdjustment ? '🔧 Edit adjustment' : '🔧 Needs adjustments';
  const isAdjustOpen = adjustFormOpenFor === keyOf(d);
  const adjustForm = isAdjustOpen
    ? '<div class="adjust-form">'
      +'<textarea id="adjust-text" placeholder="What needs to change? e.g. remove olives, swap turkey for chicken…">'+(d.adjustmentNote||'').replace(/</g,'&lt;')+'</textarea>'
      +'<div class="row" style="margin-top:6px;">'
        +'<button class="btn-small primary" onclick="saveAdjustment(\''+k+'\')">Save</button>'
        +'<button class="btn-small" onclick="cancelAdjustment()">Cancel</button>'
      +'</div>'
    +'</div>'
    : '';
  return '<div class="card'+(d.cliveSafe?'':' warn')+'" data-key="'+k+'">'
    +'<p class="dish">'+d.text+'</p>'
    +'<div class="badges">'+badgeList(d)+'</div>'
    +'<p class="meta">'+lastMade+context+'</p>'
    +'<div class="card-actions">'
      +'<button class="btn-small primary" onclick="markCooked(\''+k+'\')">'+madeLabel+'</button>'
      +willTryBtn
      +'<button class="btn-small" onclick="wontLike(\''+k+'\')">🚫 Won\'t like</button>'
      +'<button class="btn-small" onclick="toggleAdjustForm(\''+k+'\')">'+adjustLabel+'</button>'
    +'</div>'
    +adjustForm
  +'</div>';
}

function renderCards(){
  const cardsEl = document.getElementById('cards');
  if(state.shown.length===0){
    cardsEl.innerHTML = '<p class="empty">Tap “Give me ideas” above.</p>';
    return;
  }
  const remaining = eligiblePool().filter(d=>!state.shown.some(s=>keyOf(s)===keyOf(d))).length;
  cardsEl.innerHTML = state.shown.map(cardHTML).join('')
    + (remaining>0 ? '<button class="more-btn" onclick="loadMore()">+ More ideas ('+remaining+' left)</button>' : '');
}

function toggleWho(who){
  state[who] = !state[who];
  render();
}
function setMeal(m){
  state.meal = m;
  state.shown = [];
  render();
}
function shuffle(){
  state.shown = pickSuggestions(5);
  render();
}
function loadMore(){
  const pool = eligiblePool().filter(d=>!state.shown.some(s=>keyOf(s)===keyOf(d))).slice().sort((a,b)=>daysSince(b.date)-daysSince(a.date));
  if(pool.length===0) return;
  const topSlice = pool.slice(0, Math.max(15, 12));
  for(let i=topSlice.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [topSlice[i],topSlice[j]]=[topSlice[j],topSlice[i]];
  }
  state.shown = state.shown.concat(topSlice.slice(0,5));
  renderCards();
  persist();
}
function replaceShown(key){
  const idx = state.shown.findIndex(d=>keyOf(d)===key);
  if(idx===-1) return;
  const pool = eligiblePool().filter(d=>!state.shown.some(s=>keyOf(s)===keyOf(d)));
  if(pool.length===0){ state.shown.splice(idx,1); return; }
  pool.sort((a,b)=>daysSince(b.date)-daysSince(a.date));
  const candidates = pool.slice(0, Math.max(6, pool.length));
  state.shown[idx] = candidates[Math.floor(Math.random()*candidates.length)];
}
function wontLike(key){
  const d = DISHES.find(x=>keyOf(x)===key);
  if(!d) return;
  const reason = prompt("Why won't they like it? (optional)", d.dislikedNote || '');
  if(reason===null) return;
  d.disliked = true;
  if(reason.trim()) d.dislikedNote = reason.trim();
  replaceShown(key);
  render();
  persist();
  showToast("Got it — won't suggest this one again");
}
function toggleAdjustForm(key){
  adjustFormOpenFor = (adjustFormOpenFor===key) ? null : key;
  renderCards();
}
function cancelAdjustment(){
  adjustFormOpenFor = null;
  renderCards();
}
function saveAdjustment(key){
  const d = DISHES.find(x=>keyOf(x)===key);
  if(!d) return;
  const val = document.getElementById('adjust-text').value.trim();
  if(val){ d.needsAdjustment = true; d.adjustmentNote = val; }
  else { d.needsAdjustment = false; d.adjustmentNote = ''; }
  adjustFormOpenFor = null;
  renderCards();
  persist();
  showToast(val ? 'Adjustment saved — still in the mix, just noted' : 'Adjustment cleared');
}
function markCooked(key){
  const d = DISHES.find(x=>keyOf(x)===key);
  if(d){
    d.date = todayISO();
    if(d.isIdea){ d.isIdea = false; }
    d.willTry = false;
  }
  render();
  persist();
  showToast('Logged — saved to the rotation');
}
function toggleWillTry(key){
  const d = DISHES.find(x=>keyOf(x)===key);
  if(!d) return;
  d.willTry = !d.willTry;
  render();
  persist();
  showToast(d.willTry ? 'Queued — Kristin plans to try this' : 'Removed from the try-next queue');
}
function addDish(){
  const text = document.getElementById('new-text').value.trim();
  if(!text) return;
  const protein = document.getElementById('new-protein').value.trim();
  const cliveSafe = document.getElementById('new-clive').checked;
  const vegan = document.getElementById('new-vegan').checked;
  const lowSodium = document.getElementById('new-lowsodium').checked;
  const makeAhead = document.getElementById('new-makeahead').checked;
  const loved = document.getElementById('new-loved').checked;
  const madeIt = document.getElementById('new-madeit').checked;
  DISHES.push({
    text, meal: state.meal, date: madeIt ? todayISO() : null, location:'', protein,
    cliveSafe, vegetarian: vegan || cliveSafe, vegan, madeFor:'Both',
    lowSodium, makeAhead, loved, isIdea: !madeIt, willTry: !madeIt
  });
  render();
  persist();
  showToast(madeIt ? 'Added — logged as made today' : 'Added — queued as a new idea to try');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function buildFullDocument(){
  const styleText = document.getElementById('app-style').outerHTML;
  const linkTag = document.querySelector('link[href*="fonts.googleapis"]').outerHTML;
  let scriptText = document.getElementById('app-logic').textContent;
  scriptText = scriptText.replace(/\/\*DATA_START\*\/const DISHES = [\s\S]*?;\/\*DATA_END\*\//, '/*DATA_START*/const DISHES = '+JSON.stringify(DISHES)+';/*DATA_END*/');
  return '<!doctype html>\n<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Rotation</title>'
    + styleText + linkTag
    + '</head><body><div class="wrap"><div id="app"></div></div><div class="toast" id="toast"></div>'
    + '<script id="app-logic">' + scriptText + '<' + '/script></body></html>';
}

async function persist(){
  try{
    if(!artifactApi){ return; }
    await artifactApi.publish(buildFullDocument());
  }catch(e){ /* best-effort; local state still works for this view */ }
}

async function init(){
  try{
    if(window.claude && window.claude.use){
      artifactApi = await window.claude.use('artifact');
    }
  }catch(e){ artifactApi = null; }
  render();
}
init();
</script></body></html>
